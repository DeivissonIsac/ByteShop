{% extends 'base.html' %}
{% load static %}

{% block title %}Loja{% endblock %}

{% block body %}
<h1 class="text-center">Loja</h1>

{% for produto in produtos %}
    <p>{{ produto.nome }}</p>
    <p>{{ produto.preco }}</p>
    <img src="{{ produto.imagem.url }}" width="300" height="450">
{% endfor %}

{% endblock %}
