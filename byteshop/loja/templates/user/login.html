{% extends 'base.html' %}
{% load static %}

{% block title %}Login{% endblock %}

{% block body %}
<div class="container">
    <div class="row d-flex">
        <div class="col-lg-6">
            <img src="{% static 'images/login.svg' %}">
        </div>
        <div class="col-lg-6 d-flex align-items-center justify-content-center">
            <div class="card w-75 shadow mb-3" style="border-radius: 20px">
                <h1 class="text-center mt-2">Login ByteShop</h1>
                <h6 class="text-center">Entre com seu e-mail e senha.</h6>
                <form method="POST" action="{% url 'fazer_login' %}" class="card-body d-flex row">
                    {% csrf_token %}
                    <div class="">
                        <label for="inputEmail" class="form-label">E-mail</label>
                        <input type="text" name="email" class="form-control" id="inputEmail" required>
                    </div>
                    <div class="mt-3">
                        <label for="inputSenha" class="form-label">Senha</label>
                        <input type="password" name="senha" class="form-control" id="inputSenha" required>
                    </div>
                    <div class="d-flex justify-content-end mt-1">
                        <a href="{% url 'password_reset' %}" class="link-underline-light">Esqueci minha senha</a>
                    </div>
                    <div class="mt-2 ms-3 form-check">
                            <input type="checkbox" class="form-check-input" id="mostrarSenha">
                            <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
                    </div>
                    <div class="mt-3 d-flex justify-content-center gap-3">
                        <a href="{% url 'loja' %}" class="w-50"><button type="button" class="btn btn-outline-primary w-100">Voltar</button></a>
                        <button type="submit" class="btn btn-primary w-50">Entrar</button>
                    </div>
                    <div class="mt-4 d-flex justify-content-center">
                        <p>Não tem uma conta? <a href="{% url 'criar_conta' %}" class="link-success link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover">Criar conta</a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('mostrarSenha').addEventListener('change', function() {
        let senha = document.getElementById('inputSenha');
        let tipo = this.checked ? 'text' : 'password';
        senha.type = tipo;
    });
</script>
{% endblock %}
