{% extends 'base.html' %}
{% load static %}

{% block title %}Mudar Senha{% endblock %}

{% block body %}
<div class="container my-4">
    <div class="card shadow">
        <div class="card-body">
            <ul class="nav nav-tabs d-flex">
                <li class="nav-item">
                    <a class="nav-link link-dark link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" aria-current="page" href="{% url 'minha_conta' %}">
                        <strong>Meus Dados</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="{% url 'meus_pedidos' %}">
                        <strong>Meus Pedidos</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="#">
                        <strong>Meus Endereços</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="#">
                        <strong>Mudar Senha</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-danger link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="{% url 'fazer_logout' %}">
                        <strong>Sair</strong>
                    </a>
                </li>
            </ul>
            <div class="card-body d-flex justify-content-center">
                <form method="POST" action="{% url 'mudar_senha' %}" class="row col-lg-6 col-md-12 gap-3">
                    {% csrf_token %}
                    <div class="col-12">
                        <label for="inputSenhaAtual" class="form-label">Senha Atual</label>
                        <input type="password" name="senha_atual" class="form-control" id="inputSenhaAtual" required>
                    </div>
                    <div class="col-12">
                        <label for="inputSenha" class="form-label">Senha Nova</label>
                        <input type="password" name="senha_nova" class="form-control" id="inputSenha" required>
                        <div class="invalid-feedback">As senhas não são iguais.</div>
                    </div>
                    <div class="col-12">
                        <label for="inputConfirmarSenha" class="form-label">Confirmar Senha Nova</label>
                        <input type="password" name="senha_confirmacao" class="form-control" id="inputConfirmarSenha" required>
                    </div>
                    <div class="col-12 ms-3 form-check">
                        <input type="checkbox" class="form-check-input" id="mostrarSenha">
                        <label class="form-check-label" for="mostrarSenha">Mostrar senha</label>
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    document.getElementById('mostrarSenha').addEventListener('change', function() {
        let senha_atual = document.getElementById('inputSenhaAtual');
        let senha = document.getElementById('inputSenha');
        let confirmarSenha = document.getElementById('inputConfirmarSenha');
        let tipo = this.checked ? 'text' : 'password';
        senha.type = tipo;
        senha_atual.type = tipo;
        confirmarSenha.type = tipo;
    });

    function validarSenhas() {
        let senha = document.getElementById('inputSenha');
        let confirmarSenha = document.getElementById('inputConfirmarSenha');
        let botaoCriarConta = document.getElementById('btnCriarConta');

        if (confirmarSenha.value.length > 0) {
            if (senha.value !== confirmarSenha.value) {
                senha.classList.add('is-invalid');
                confirmarSenha.classList.add('is-invalid');
                 botaoCriarConta.disabled = true;
            } else {
                senha.classList.remove('is-invalid');
                confirmarSenha.classList.remove('is-invalid');
                 botaoCriarConta.disabled = false;
            }
        } else {
            senha.classList.remove('is-invalid');
            confirmarSenha.classList.remove('is-invalid');
             botaoCriarConta.disabled = false;
        }
    }

    document.getElementById('inputConfirmarSenha').addEventListener('input', validarSenhas);
    document.getElementById('inputSenha').addEventListener('input', validarSenhas);
</script>
{% endblock %}
