{% extends 'base.html' %}
{% load static %}

{% block title %}Minha Conta{% endblock %}

{% block body %}
<div class="container my-4">
    <div class="card shadow">
        <div class="card-body">
            <ul class="nav nav-tabs d-flex">
                <li class="nav-item">
                    <a class="nav-link active link-primary link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" aria-current="page" href="">
                        <strong>Meus Dados</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="{% url 'meus_pedidos' %}">
                        <strong>Meus Pedidos</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="">
                        <strong>Meus Endereços</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-dark link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="{% url 'mudar_senha' %}">
                        <strong>Mudar Senha</strong>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link link-danger link-offset-2 link-underline-opacity-25 link-underline-opacity-100-hover" href="{% url 'fazer_logout' %}">
                        <strong>Sair</strong>
                    </a>
                </li>
            </ul>
            <div class="card-body d-flex justify-content-center">
                <form method="POST" action="{% url 'minha_conta' %}" class="row col-lg-6 col-md-12 gap-3">
                    {% csrf_token %}
                    <div class="col-12">
                        <label for="inputNome" class="form-label">Nome</label>
                        <input type="text" name="nome" class="form-control" id="inputNome" value="{% if request.user.cliente.nome %}{{ request.user.cliente.nome }}{% else %}{% endif %}">
                    </div>
                    <div class="col-12">
                        <label for="inputEmail" class="form-label">E-mail</label>
                        <input type="email" name="email" class="form-control" id="inputEmail" value="{{ request.user.cliente.email }}" required>
                    </div>
                    <div class="col-12">
                        <label for="inputCpf" class="form-label">CPF</label>
                        <input type="text" name="cpf" class="form-control" id="inputCpf" value="{% if request.user.cliente.cpf %}{{ request.user.cliente.cpf }}{% else %}{% endif %}">
                    </div>
                    <div class="col-12">
                        <label for="inputTelefone" class="form-label">Telefone</label>
                        <input type="tel" name="telefone" class="form-control" id="inputTelefone" value="{% if request.user.cliente.telefone %}{{ request.user.cliente.telefone }}{% else %}{% endif %}">
                    </div>
                    <div class="d-flex justify-content-end">
                        <button type="submit" class="btn btn-primary">Salvar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
